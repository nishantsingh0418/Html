<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        background{
            color: brown;
        }
        button{
            color: aqua;
            background-color: blueviolet;
        }


    </style>
</head>
<body>
    <form>
    <h1> Student Registratin Form</h1>
    <label>Full Name:</label>
    <input type="text" placeholder="Enter Full Name">

    <br><br>

    <label>Email:</label>
    <input type="text" placeholder="Enter your email">

    <br><br>


    <label>Password:</label>
    <input type="text" placeholder="Enter your password">

    <br><br>

    <label>Age:</label>
    <input type="text" placeholder="Enter your age">

    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male" required> Male
    <input type="radio" name="gender" value="female" required> Female
    <input type="radio" name="gender" value="other" required> other

    <br><br>

    <label>Select Skills:</label>
    <input type="checkbox" name="select skills" value="html" > HTML
    <input type="checkbox" name="select skills" value="css" > CSS
    <input type="checkbox" name="select skills" value="javascript" > Javascript
    <input type="checkbox" name="select skills" value="python" > Python

    <br><br>

    <label>Address:</label>
    <textarea placeholder="Enter your address"></textarea>
    <br><br>

    <button>submit</button>

</form>
    
</body>
</html>
