<!DOCTYPE html>
<html>
<head>
   
    <title>DISPLAY</title>

    <style>

        .block{
            display:block;
            width:200px;
            background-color:lightblue;
            margin:5px;
        }

        .inline{
            display:inline;
            background-color:lightgreen;
        }

        .inline-block{
            display:inline-block;
            width:150px;
            height:50px;
            background-color:lightyellow;
            margin:5px;
        }

        .none{
            display:none;
        }
    </style>
</head>
<body>
    <h2>1.block</h2>

    <div class="block">box 1</div>
    <div class="block">box 2</div>
    <div class="block">box 3</div>
</body>
</html>
