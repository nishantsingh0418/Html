<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>CARD</title>


    <style>
    
        .card{
            text-align: center;
            width: 300px; /*width of the card */
            padding: 5px; /*space inside the card*/
            background-color:rgb(240, 240, 240);
            border: 2px solid rgb(9, 0, 5);/*the boundary line of the box */
            border-radius: 5px; /*rounded corners*/
        }

        .crad h2{

            color: rgb(255, 3, 3);
            text-align: center;
        }

        .card p{
            color: rgb(251, 1, 1);
            text-align: center;
        }
        
    </style>
</head>
<body>
    <div class="card">

        <h2>Web Development</h2>


        <p>
            Learn HTML and CSS to create beautiful webpages.
        </p>
    </div>
    
</body>
</html>
