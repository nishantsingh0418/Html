<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>

    <script>

        let fruits = ["Apple","Banana","Mango"];

        console.log("Fruits : ",fruits);

        console.log("First Fruits : ",fruit[0]);
        console.log("Second Fruits : ",fruit[1]);
        console.log("Third Fruits : ",fruit[2]);

    </script>
    
</body>
</html>
